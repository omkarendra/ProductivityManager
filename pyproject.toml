[project]
name = "promo"
version = "0.1.0"
description = "A productivity management application."
requires-python = ">=3.12"

[project.scripts]
promo = "promo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"